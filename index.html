const AI={
  rec(wr,di,seed=0){
    if(!wr.length)return"Ajoute des vêtements pour des suggestions.";
    const by=c=>wr.filter(w=>w.category===c);
    const best=a=>a.length?[...a].sort((a,b)=>(b.scoreLike+b.scoreCut)-(a.scoreLike+a.scoreCut))[0]:null;
    const wE=di>=5,day=DF[di].toLowerCase();
    const jean=best(by("Pantalons").filter(p=>p.name.toLowerCase().includes("jean")));
    const pull=best(by("Pulls")),jogg=best(by("Joggings")),shoes=best(by("Chaussures")),veste=best(by("Vestes"));
    const bas=wE?(jogg||jean):jean;
    const parts=[bas,pull,di>=1?veste:null,shoes].filter(Boolean);
    if(parts.length<2)return"Enrichis ta garde-robe pour des suggestions.";
    const intros=["Pour ce "+day+" :","Suggestion grisch "+day+" —","Le combo du "+day+" :","Mise sur ce fit "+day+" :",""+DF[di]+" ="];
    return pS(intros,di+seed)+" "+parts.map(p=>p.name).join(" + ")+".";
  },
  suggest(wr,evType,di){
    if(!wr.length)return"Ajoute des vêtements.";
    const by=c=>wr.filter(w=>w.category===c);
    const best=a=>a.length?[...a].sort((a,b)=>(b.scoreLike+b.scoreCut)-(a.scoreLike+a.scoreCut))[0]:null;
    const jean=best(by("Pantalons").filter(p=>p.name.toLowerCase().includes("jean")));
    const pull=best(by("Pulls")),shoes=best(by("Chaussures")),veste=best(by("Vestes")),jogg=best(by("Joggings"));
    const rules={"Sport":()=>[jogg,pull,shoes],"Soirée":()=>[jean,best(by("Pulls").filter(p=>p.scoreLike>=9)),veste,shoes],"default":()=>[jean,pull,veste,shoes]};
    return((rules[evType]||rules["default"])()).filter(Boolean).map(p=>p.name).join(" + ")||"Pas assez de pièces.";
  },
  analyze(wr){
    const by=c=>wr.filter(w=>w.category===c);
    const avg=a=>{const c=a.filter(v=>typeof v==="number");return c.length?Math.round(c.reduce((s,v)=>s+v,0)/c.length*10)/10:0;};
    const aS=a=>avg(a.flatMap(w=>[w.scoreLike||0,w.scoreCut||0]));
    const cS=c=>{const it=by(c);if(!it.length)return 1;const q=Math.min(it.length,5);return Math.min(10,Math.round(((q/5)*5+aS(it)/2)*10)/10);};
    const scores={};CATS.forEach(c=>{scores[c]=cS(c);});
    const cc={};wr.forEach(w=>{cc[w.color]=(cc[w.color]||0)+1;});
    const miss=KC.filter(c=>!cc[c]),low=wr.filter(w=>(w.scoreLike||0)<5);
    const fp=[];
    if(wr.length<10)fp.push("Bonne base — quelques ajouts ciblés élèveraient l'ensemble.");
    else fp.push("Garde-robe consistante et bien construite.");
    const weak=CATS.filter(c=>cS(c)<4);
    if(weak.length)fp.push("Catégories à renforcer : "+weak.join(", ")+".");
    if(miss.length)fp.push("Coloris absents : "+miss.join(", ")+".");
    if(low.length)fp.push(low.length+" pièce"+(low.length>1?"s":"")+" avec note basse.");
    if(!weak.length&&!miss.length&&!low.length)fp.push("Garde-robe bien équilibrée 👍");
    const details={};
    CATS.forEach(c=>{
      const it=by(c),s=cS(c);
      if(!it.length){const sg={"Pantalons":"Aucun pantalon.","Pulls":"Aucun pull.","Vestes":"Aucune veste.","Chaussures":"Aucune chaussure.","Shirts":"Aucun shirt.","Joggings":"Aucun jogging.","Accessoires":"Aucun accessoire."};details[c]=sg[c]||"Vide.";}
      else{const top=[...it].sort((a,b)=>(b.scoreLike+b.scoreCut)-(a.scoreLike+a.scoreCut))[0];
        details[c]=s>=8?"Excellent ("+it.length+" pièce"+(it.length>1?"s":"")+"). Top : "+top.name+".":s>=5?"Bonne base ("+it.length+"), moy. "+aS(it).toFixed(1)+"/10.":"Légère ("+it.length+"). À étoffer.";}
    });
    return{scores,feedback:fp.join(" "),details};
  },
  styleRecs(wr){
    const by=c=>wr.filter(w=>w.category===c);
    const cc={};wr.forEach(w=>{cc[w.color]=(cc[w.color]||0)+1;});
    const cat={
      "Pantalons":[{name:"Jean Flared Noir",brand:"",color:"Noir",price:"",reason:"Upgrade statement — dans la continuité du jogging flared"},{name:"Cargo Beige",brand:"Carhartt WIP",color:"Beige",price:"110",reason:"Coloris chaud absent de ta palette"}],
      "Pulls":[{name:"Pull Gris",brand:"",color:"Gris",price:"60",reason:"Coloris manquant — très polyvalent"},{name:"Pull Col Roulé Noir",brand:"COS",color:"Noir",price:"75",reason:"Layering puissant sous la Veste V"}],
      "Vestes":[{name:"Veste Workwear",brand:"Dickies",color:"Beige",price:"85",reason:"Workwear authentique — complète la Veste V"},{name:"Veste Sherpa",brand:"",color:"Crème",price:"90",reason:"Texture unique, différent de tout ce que tu as"}],
      "Chaussures":[{name:"NB 574 Gris",brand:"New Balance",color:"Gris",price:"90",reason:"Complète les Sacai — chunky accessible"},{name:"Chuck 70 Noir",brand:"Converse",color:"Noir",price:"85",reason:"Alternative canvas noire polyvalente"}],
      "Shirts":[{name:"Shirt Oxford",brand:"Ralph Lauren",color:"Blanc",price:"85",reason:"Registre élégant manquant — overshirt parfait"}],
      "Joggings":[{name:"Jogging Crème",brand:"",color:"Crème",price:"",reason:"Teinte douce absente de tes joggings"}],
      "Accessoires":[{name:"Bonnet",brand:"Carhartt WIP",color:"Noir",price:"30",reason:"Accessoire hiver essentiel"},{name:"Sac Tote",brand:"",color:"Noir",price:"",reason:"Complèterait les tenues école"}],
    };
    const prio=[];
    CATS.forEach(c=>{
      const it=by(c),ci=cat[c]||[];if(!ci.length)return;
      const cands=ci.filter(r=>!by(c).some(w=>w.name===r.name));
      if(!it.length)cands.slice(0,2).forEach(r=>prio.push({...r,category:c,priority:9+Math.random()}));
      else if(it.length<2)cands.slice(0,1).forEach(r=>prio.push({...r,category:c,priority:7+Math.random()}));
      else{const miss=cands.filter(r=>!cc[r.color]);miss.slice(0,1).forEach(r=>prio.push({...r,category:c,priority:5+Math.random()}));}
    });
    return prio.sort((a,b)=>b.priority-a.priority).slice(0,8).map(r=>({...r,priority:Math.round(r.priority)}));
  },
  colorReport(wr){
    const cc={};wr.forEach(w=>{cc[w.color]=(cc[w.color]||0)+1;});
    const miss=KC.filter(c=>!cc[c]);
    const dom=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const lines=[];
    if(dom.length)lines.push("Dominantes : "+dom.map(([c,n])=>c+" ("+n+")").join(", ")+".");
    if(miss.length){const m={"Gris":"Le gris manque — très polyvalent.","Beige":"Le beige apporte chaleur."};miss.slice(0,2).forEach(c=>{if(m[c])lines.push(m[c]);});}
    if(!miss.length&&wr.length>=8)lines.push("Palette cohérente et équilibrée.");
    return lines.join(" ");
  },
};

function computeStats(){

      ["Jean Gris",/jean gris/i],["Jean Blanc",/jean blanc/i],["Jean Noir",/jean noir/i],["Jean Bleu",/jean bleu/i],

      ["Quarter Zip Bleu",/quarter zip|qz bleu/i],["Veste V",/veste v/i],
      ["Jogging Bleu Nike",/jogging bleu|jogg bleu/i],["Jogging Flared",/jogg.+flared|jogging flared/i],
      ["Jogging Jaune Nike",/jogg.+jaune/i],["K-Way",/k.?way/i],
      ["NB Sacai",/sacai/i],["NB AM",/\bnb am\b/i],["Doudoune",/doudoune/i],
    ];
    pats.forEach(([nm,re])=>{if(re.test(ev.outfit))pc[nm]=(pc[nm]||0)+1;});
  });
  const df=[0,0,0,0,0,0,0];
  evs.forEach(ev=>{if(ev.dayOfWeek!=null&&ev.dayOfWeek<7)df[ev.dayOfWeek]++;});
  const cc={};

      ["Jean Gris + Pull Noir",/jean gris.+pull noir/i],["Jean Blanc + Pull Blanc",/jean blanc.+pull blanc/i],
      ["Jean Blanc + QZ Bleu",/jean blanc.+(quarter zip|qz)/i],["Jean Gris + Pull Ralph",/jean gris.+ralph/i],
      ["Jean Noir + Pull Noir",/jean noir.+pull noir/i],["Jogging Bleu + Pull Blanc",/jogg.+bleu.+pull blanc/i],
      ["Jean Blanc + Veste V",/jean blanc.+veste v/i],["Jogging Flared + Pull Noir",/jogg.+flared.+pull noir/i],
    ];
    cp.forEach(([nm,re])=>{if(re.test(ev.outfit))cc[nm]=(cc[nm]||0)+1;});
  });
  return{pc,df,cc,total:evs.length};
}

function spider(scores){
  const cats=Object.keys(scores),n=cats.length;if(n<3)return"";
  const W=260,cx=130,cy=122,r=86;
  const pt=(i,ratio)=>{const a=(i/n)*2*Math.PI-Math.PI/2;return[cx+r*ratio*Math.cos(a),cy+r*ratio*Math.sin(a)];};
  const sP=cats.map((_,i)=>pt(i,Math.max(0.05,(scores[cats[i]]||0)/10)));
  const lP=cats.map((_,i)=>pt(i,1.32));
  const gp=rv=>cats.map((_,i)=>pt(i,rv)).map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+"Z";
  const sp=sP.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+"Z";
  const sc=v=>v>=7?T.g:v>=5?T.a:T.r;
  const g=[.25,.5,.75,1].map(rv=>'<path d="'+gp(rv)+'" fill="none" stroke="'+(rv===1?T.l2:T.l1)+'" stroke-width="'+(rv===1?1:.7)+'"/>').join("");
  const ax=cats.map((_,i)=>{const p=pt(i,1);return'<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="'+T.l1+'" stroke-width=".7"/>';}).join("");
  const gl=[2.5,5,7.5].map((v,i)=>'<text x="'+(cx+3)+'" y="'+(cy-r*(i+1)*.25+3)+'" fill="'+T.t4+'" font-size="7.5" font-family="inherit">'+v+"</text>").join("");
  const dt=sP.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="'+sc(scores[cats[i]]||0)+'" stroke="'+T.bg+'" stroke-width="2.5"/>').join("");
  const lb=cats.map((c,i)=>{const[lx,ly]=lP[i];const anch=lx<cx-12?"end":lx>cx+12?"start":"middle";return'<text x="'+lx+'" y="'+ly+'" text-anchor="'+anch+'" dominant-baseline="middle" fill="'+T.t2+'" font-size="9" font-family="inherit" font-weight="700">'+c+"</text>";}).join("");
  const svg='<svg width="'+W+'" height="244" style="display:block;margin:0 auto;">'+g+ax+gl+'<path d="'+sp+'" fill="rgba(0,0,0,0.05)" stroke="'+T.ink+'" stroke-width="1.6"/>'+dt+lb+"</svg>";
  const rows=cats.map(c=>{const s=scores[c]||0,col=sc(s),cl=CL2[Math.round(s)]||"";return'<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid '+T.l1+'"><div style="width:5px;height:5px;background:'+col+';flex-shrink:0;"></div><span style="font-size:11px;color:'+T.t2+';flex:1;font-weight:600;">'+c+'</span><span style="font-size:9px;font-weight:700;color:'+col+';letter-spacing:.08em;text-transform:uppercase;">'+cl+'</span><span style="font-size:13px;color:'+T.ink+';font-weight:900;min-width:20px;text-align:right;">'+s+"</span></div>";}).join("");
  return svg+'<div style="border-top:1px solid '+T.l1+';margin-top:12px;">'+rows+"</div>";
}

    return'<div><div style="font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:'+T.t4+';padding:7px 10px;background:'+T.s1+';border-bottom:1px solid '+T.l1+';">'+cat+"</div>"+rows+"</div>";
  }).join("");
  const sc=(f.items||[]).length;
  return SW2("ofS",isA?"Créer une tenue":"Modifier la tenue",
    fld("Nom de la tenue *",f.name||"","uOfF('name',this.value)","Ex: Ralph Day")
    +'<div style="margin-bottom:16px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div style="font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:'+T.t3+';">Pièces · '+sc+' sélectionnée'+(sc>1?"s":"")+"</div>"+(sc>0?'<button onclick="clrOfI()" style="background:none;border:none;font-size:9px;color:'+T.r+';cursor:pointer;font-weight:700;font-family:inherit;">TOUT DÉSÉLECT.</button>':"")+"</div>"
      +'<div style="max-height:300px;overflow-y:auto;border:1px solid '+T.l1+';">'+catIt+"</div>"
    +"</div>"
    +fld("Note",f.note||"","uOfF('note',this.value)","Occasion, météo, style…")
    +slider("Note globale",f.rating||5,"sOfR")
    +'<button onclick="saveOf()" class="bp" style="width:100%;">Sauvegarder la tenue</button>'
    +(!isA?'<button onclick="dOf(\''+f.id+'\')" class="bd"><span style="display:flex;align-items:center;gap:7px;">'+ico("del",13,T.r)+"Supprimer</span></button>":"")
  ,true);
}
function rShAn(){
  if(st.aS!=="an")return"";
  const an=st.an,lo=st.anL;
  let c="";
  if(lo){
    const sk=[100,80,90,70,85].map((w,i)=>'<div style="border:1px solid '+T.l1+';padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><div class="skel" style="height:11px;width:'+Math.round(w*0.45)+'%;"></div><div class="skel" style="height:11px;width:18%;"></div></div><div class="skel" style="height:9px;margin-bottom:5px;"></div><div class="skel" style="height:9px;width:'+w+'%;margin-bottom:10px;"></div><div class="skel" style="height:2px;"></div></div>').join("");
    c='<div style="background:'+T.s1+';border:1px solid '+T.l1+';padding:18px 14px;margin-bottom:14px;"><div style="display:flex;justify-content:center;align-items:center;height:200px;flex-direction:column;gap:16px;">'
      +'<div style="display:flex;gap:5px;">'
        +[0,1,2].map(i=>'<div style="width:8px;height:8px;background:'+T.l2+';border-radius:50%;animation:pulse .9s ease-in-out '+(i*0.2)+'s infinite;"></div>').join("")
      +"</div><div style=\"font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:"+T.t3+';">Analyse en cours…</div></div></div>'+sk;
  }else if(an){
    const cr=AI.colorReport(st.wr);
    const det=Object.entries(an.details).map(([cat,text])=>{
      const raw=an.scores?.[cat],sc=raw!=null?Math.min(10,Math.max(1,Math.round(raw))):null;
      return'<div style="border:1px solid '+T.l1+';padding:12px 14px;margin-bottom:8px;">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;"><span style="font-size:12px;font-weight:900;color:'+T.ink+';text-transform:uppercase;letter-spacing:.04em;">'+cat+"</span>"+(sc!=null?sBdg(sc):"")+"</div>"
        +'<p style="font-size:12px;color:'+T.t2+';line-height:1.72;margin:0 0 10px;">'+text+"</p>"
        +(sc!=null?'<div style="height:2px;background:'+T.s3+'"><div style="width:'+sc*10+'%;height:100%;background:'+(sc>=7?T.g:sc>=5?T.a:T.r)+';"></div></div>':"")
      +"</div>";
    }).join("");
    c='<div style="background:'+T.s1+';border:1px solid '+T.l1+';padding:18px 14px;margin-bottom:14px;">'+spider(an.scores)+"</div>"
      +(an.feedback?'<div style="background:'+T.s1+';border:1px solid '+T.l1+';padding:13px 14px;margin-bottom:14px;"><div style="font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:'+T.t3+';margin-bottom:8px;">Analyse globale</div><p style="font-size:13px;color:'+T.t1+';line-height:1.78;margin:0;">'+an.feedback+"</p></div>":"")
      +(cr?'<div style="background:'+T.bBg+';border:1px solid #BFDBFE;padding:13px 14px;margin-bottom:14px;"><div style="font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:'+T.b+';margin-bottom:8px;">Palette de couleurs</div><p style="font-size:13px;color:'+T.b+';line-height:1.7;margin:0;">'+cr+"</p></div>":"")
      +det
      +'<button onclick="runAn()" class="bo" style="width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:7px;">'+ico("bar",12,T.t2,1.8)+"Relancer l'analyse</button>";
  }else{
    c='<div style="text-align:center;padding:56px 0;">'+ico("bar",22,T.t4)+'<div style="font-size:12px;color:'+T.t3+';font-weight:700;margin-top:10px;">Aucune analyse</div><button onclick="runAn()" class="bp" style="margin:16px auto 0;display:flex;align-items:center;gap:7px;">'+ico("bar",13,"#fff",2)+"Lancer l'analyse</button></div>";
  }
  return SW2("an","Rapport garde-robe",c,true);
}
function rShWi(){
  if(st.aS!=="wi")return"";
  const f=st.wiF,isA=!f.id;
  return SW2("wi",isA?"Ajouter à la wishlist":"Modifier l'article",
    fld("Nom *",f.name||"","uWiF('name',this.value)","Ex: Pull Gris COS")
    +sel("Catégorie",f.category||CATS[0],"uWiF('category',this.value)",CATS)
    +cpick(f.color||GC[0],"wi")
    +fld("Marque",f.brand||"","uWiF('brand',this.value)","Nike, Ralph Lauren…")
    +fld("Budget (€)",f.price||"","uWiFP(this.value)","80")
    +fld("Note",f.reason||"","uWiF('reason',this.value)","Pourquoi ce vêtement…",true)
    +'<button onclick="saveWi()" class="bp" style="width:100%;">Sauvegarder</button>'
    +(!isA?'<button onclick="dWi(\''+f.id+'\')" class="bd"><span style="display:flex;align-items:center;gap:7px;">'+ico("del",13,T.r)+"Supprimer</span></button>":"")
  ,true);
}

// ── SHEET SUGGESTION PAR JOUR ──
function rShSug(){
  if(st.aS!=="sug")return"";
  const di=st.sugDay,txt=st.sugText,lo=st.sugLoading;
  const dayBtns=DF.map((d,i)=>{
    const iS=di===i;
    return'<button onclick="setSugDay('+i+')" style="flex:1;background:'+(iS?T.ink:T.s1)+';border:1px solid '+(iS?T.ink:T.l1)+';padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .1s;">'
      +'<span style="font-size:9px;font-weight:800;letter-spacing:.1em;color:'+(iS?"rgba(255,255,255,.5)":T.t4)+';">'+DS[i]+"</span>"
      +'<span style="font-size:13px;font-weight:900;color:'+(iS?"#fff":T.ink)+';letter-spacing:-.02em;">'+d.slice(0,3)+"</span>"
    +"</button>";
  }).join("");
  const sugBlock=lo
    ?'<div style="background:'+T.s1+';border:1px solid '+T.l1+';padding:18px 14px;"><div style="display:flex;justify-content:center;align-items:center;height:60px;gap:8px;">'
      +[0,1,2].map(i=>'<div style="width:7px;height:7px;background:'+T.l2+';border-radius:50%;animation:pulse .9s ease-in-out '+(i*0.2)+'s infinite;"></div>').join("")
    +"</div></div>"
    :txt
      ?'<div style="background:'+T.ink+';padding:16px 18px;animation:fadeIn .2s ease-out;">'
        +'<div style="font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:10px;">'+DF[di]+" — Suggestion grisch</div>"
        +'<p style="font-size:14px;color:rgba(255,255,255,.9);line-height:1.75;margin:0 0 14px;font-weight:400;">'+txt+"</p>"
        +'<button onclick="useSugDay()" style="background:rgba(255,255,255,.12);border:none;padding:8px 14px;font-size:10px;color:rgba(255,255,255,.8);cursor:pointer;font-family:inherit;font-weight:800;letter-spacing:.1em;text-transform:uppercase;">APPLIQUER AU PLANNING</button>'
      +"</div>"
      :'<div style="background:'+T.s1+';border:1px solid '+T.l1+';padding:24px 16px;text-align:center;">'
        +'<div style="font-size:12px;color:'+T.t3+';font-weight:600;">Sélectionne un jour et génère une suggestion</div>'
      +"</div>";
  return SW2("sug","Suggestion par jour",
    '<div style="margin-bottom:16px;"><div style="font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:'+T.t3+';margin-bottom:10px;">Quel jour ?</div>'
    +'<div style="display:flex;gap:4px;">'+dayBtns+"</div></div>"
    +'<button onclick="genSugDay()" class="bp" style="width:100%;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:7px;" '+(lo?"disabled":"")+">"+ico("magic",13,"#fff",2)+(lo?"GÉNÉRATION…":"GÉNÉRER LA SUGGESTION")+"</button>"
    +sugBlock
  );
}

// ── RENDER PRINCIPAL ──
function rS(){
  const c=document.getElementById("sc");
  c.innerHTML=rShEvt()+rShOut()+rShRate()+rShWD()+rShOf()+rShAn()+rShWi()+rShSug();
}
function render(){
  const app=document.getElementById("app");
  let page="";
  if(st.tab===0)page=rPlanning();
  else if(st.tab===1)page=rWardrobe();
  else page=rStyleAI();
  const nav=[{l:"Planning",i:"cal"},{l:"Garde-robe",i:"hng"},{l:"Style IA",i:"str"}];
  app.innerHTML='<div style="height:env(safe-area-inset-top,44px);background:#fff;"></div>'
    +'<header style="height:48px;padding:0 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid '+T.l1+';background:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;">'
      +'<span style="font-size:15px;font-weight:900;letter-spacing:.06em;color:'+T.ink+';text-transform:uppercase;">GRISCH</span>'
      +'<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:9px;font-weight:800;letter-spacing:.14em;color:'+T.t4+';">'+st.wr.length+' PIÈCES</span><div style="width:1px;height:12px;background:'+T.l1+'"></div><span style="font-size:9px;font-weight:800;letter-spacing:.14em;color:'+T.t4+';">'+st.ev.filter(e=>e.outfit).length+' TENUES</span></div>'
    +"</header>"
    +'<main style="padding:20px 18px;padding-bottom:90px;overflow-y:auto;-webkit-overflow-scrolling:touch;">'+page+"</main>"
    +'<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid '+T.l1+';padding-bottom:env(safe-area-inset-bottom,12px);z-index:50;">'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);">'
        +nav.map((t,i)=>{const on=st.tab===i;return'<button onclick="setTab('+i+')" style="background:none;border:none;cursor:pointer;padding:12px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;position:relative;">'+(on?'<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:'+T.ink+';"></div>':"")
          +ico(t.i,20,on?T.ink:T.t4,on?2.2:1.6)+'<span style="font-size:8px;letter-spacing:.14em;font-weight:'+(on?900:600)+';color:'+(on?T.ink:T.t4)+';text-transform:uppercase;">'+t.l+"</span></button>";}).join("")
      +"</div>"
    +"</nav>";
  rS();
}

// ── ACTIONS ──
function setTab(i){st.tab=i;render();}
function selDay(i){st.sd=i;st.rt="";st.twd="";render();}
function chgWk(d,m){if(m==="r")st.wo=0;else st.wo+=d;st.rt="";st.twd="";render();}
function refreshRec(){st.rk++;st.rt="";st.twd="";render();}

// Suggestion par jour
function oSugSheet(){st.sugDay=st.sd;st.sugText="";st.sugLoading=false;oS("sug");}
function setSugDay(i){st.sugDay=i;st.sugText="";rS();}
function genSugDay(){
  st.sugLoading=true;rS();
  setTimeout(()=>{
    st.sugText=AI.rec(st.wr,st.sugDay,st.rk+100);
    st.sugLoading=false;rS();
  },600);
}
function useSugDay(){
  // Navigue vers le jour sélectionné et affiche la suggestion dans la carte
  st.sd=st.sugDay;st.rt="";st.twd=st.sugText;
  // Met la suggestion comme recText pour affichage immédiat
  const txt=st.sugText;st.rt=txt;st.twd=txt;
  cS();
}

// Events
function oAES(){st.evF={type:"École",repeat:false,dayOfWeek:st.sd,date:fmt(gWD()[st.sd]),outfit:"",note:"",_m:"add"};oS("addEv");}
function oEES(id){const ev=st.ev.find(e=>e.id===id);if(!ev)return;st.evF={...ev,_m:"edit"};oS("addEv");}
function uEF(k,v){st.evF[k]=v;rS();}
function saveEv(){
  const f=st.evF;
  if(f._m==="add"){const{_m,...r}=f;st.ev.push({...r,id:Date.now()+"",outfitRating:{}});}
  else{const idx=st.ev.findIndex(e=>e.id===f.id);if(idx>=0){const{_m,...r}=f;st.ev[idx]={...r};}}
  sv("gq_ev4",st.ev);toast("Événement sauvegardé ✓","g");cS();
}
function dEv(id){st.ev=st.ev.filter(e=>e.id!==id);sv("gq_ev4",st.ev);toast("Événement supprimé");render();}
function dEFrS(id){dEv(id);cS();}

// Outfit sur event
function oOSp(evId,standalone){
  const wd=gWD();
  if(standalone){st.sD={ev:{id:null,type:"Tenue libre",outfit:"",note:""},standalone:true};st.outF={outfit:"",note:"",evId:null,standalone:true,di:st.sd,date:fmt(wd[st.sd])};}
  else{const ev=st.ev.find(e=>e.id===evId);if(!ev)return;st.sD={ev};st.outF={outfit:ev.outfit||"",note:ev.note||"",evId,standalone:false,di:st.sd,date:fmt(wd[st.sd])};}
  st.aiSug="";oS("outfit");
}
function uOF(k,v){st.outF[k]=v;rS();}
function getSug(){st.aiSug=AI.suggest(st.wr,st.sD.ev?.type||"École",st.sd);rS();}
function useAiS(){st.outF.outfit=st.aiSug;rS();}
function saveOut(){
  const f=st.outF;
  if(f.standalone){st.ev.push({id:Date.now()+"",type:"Tenue libre",date:f.date,dayOfWeek:f.di,repeat:false,outfit:f.outfit,note:f.note,outfitRating:{}});}
  else{const idx=st.ev.findIndex(e=>e.id===f.evId);if(idx>=0)st.ev[idx]={...st.ev[idx],outfit:f.outfit,note:f.note};}
  sv("gq_ev4",st.ev);toast("Tenue sauvegardée ✓","g");cS();
}

// Rating
function oRS(evId){const ev=st.ev.find(e=>e.id===evId);if(!ev)return;st.sD={ev};st.rF={style:ev.outfitRating?.style||5,practical:ev.outfitRating?.practical||5,evId};oS("rate");}
function sRS(v){st.rF.style=v;rS();}
function sRP(v){st.rF.practical=v;rS();}
function saveRate(){
  const f=st.rF,idx=st.ev.findIndex(e=>e.id===f.evId);
  if(idx>=0)st.ev[idx]={...st.ev[idx],outfitRating:{style:f.style,practical:f.practical}};
  sv("gq_ev4",st.ev);toast("Notation enregistrée ✓","g");cS();
}

// Wardrobe
function sWSec(s){st.wSec=s;st.wSrch="";st.wCat=null;render();}
function sWSrch(v){st.wSrch=v;render();}
function sWCat(c){st.wCat=c;render();}
function clrWF(){st.wSrch="";st.wCat=null;render();}
function oAWS(){st.wdF={name:"",brand:"",color:GC[0],category:CATS[0],scoreCut:7,scoreLike:7,scoreWorn:5,photo:""};oS("wd");}
function oEWS(id){const it=st.wr.find(w=>w.id===id);if(!it)return;st.wdF={...it};oS("wd");}
function uWF(k,v){st.wdF[k]=v;rS();}
function setFC(fk,c){if(fk==="wd")st.wdF.color=c;else if(fk==="wi")st.wiF.color=c;rS();}
function sWCut(v){st.wdF.scoreCut=v;rS();}
function sWLike(v){st.wdF.scoreLike=v;rS();}
function sWWorn(v){st.wdF.scoreWorn=v;rS();}
function onPhC(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{st.wdF.photo=rd.result;rS();};rd.readAsDataURL(f);}
function saveWD(){
  const f=st.wdF;if(!f.name?.trim()){toast("Le nom est obligatoire","err");return;}
  if(!f.id){st.wr.push({...f,id:Date.now()+""});toast("Vêtement ajouté ✓","g");}
  else{const idx=st.wr.findIndex(w=>w.id===f.id);if(idx>=0)st.wr[idx]={...f};toast("Modifié ✓","g");}
  sv("gq_wr4",st.wr);cS();
}
function dWD(id){st.wr=st.wr.filter(w=>w.id!==id);sv("gq_wr4",st.wr);toast("Supprimé");cS();}

// Outfits sauvegardés
function oAOfS(){st.ofF={name:"",items:[],note:"",rating:5};oS("ofS");}
function oEOfS(id){const o=st.of.find(o=>o.id===id);if(!o)return;st.ofF={...o,items:[...(o.items||[])]};oS("ofS");}
function uOfF(k,v){st.ofF[k]=v;rS();}
function tgOfI(nm){const it=st.ofF.items||[];st.ofF.items=it.includes(nm)?it.filter(x=>x!==nm):[...it,nm];rS();}
function clrOfI(){st.ofF.items=[];rS();}
function sOfR(v){st.ofF.rating=v;rS();}
function saveOf(){
  const f=st.ofF;if(!f.name?.trim()){toast("Le nom est obligatoire","err");return;}
  if(!f.id){st.of.push({...f,id:Date.now()+""});toast("Tenue sauvegardée ✓","g");}
  else{const idx=st.of.findIndex(o=>o.id===f.id);if(idx>=0)st.of[idx]={...f};toast("Tenue sauvegardée ✓","g");}
  sv("gq_of4",st.of);cS();
}
function dOf(id){st.of=st.of.filter(o=>o.id!==id);sv("gq_of4",st.of);toast("Supprimé");cS();}

// Analyse
function runAn(){
  st.anL=true;st.an=null;oS("an");
  setTimeout(()=>{
    try{st.an=AI.analyze(st.wr);toast("Analyse générée ✓","g");}
    catch(e){toast("Erreur","err");}
    st.anL=false;rS();
  },750);
}

// Style AI
function sTTab(t){st.stab=t;render();}
function genRecs(){st.recsL=true;render();setTimeout(()=>{st.recs=AI.styleRecs(st.wr);st.recsL=false;render();},700);}
function addToWL(i){
  const item=st.recs[i];if(!item)return;
  if(!st.wl.find(w=>w.name===item.name)){st.wl.push({...item,id:Date.now()+"",bought:false});sv("gq_wl4",st.wl);toast("Ajouté à la wishlist ✓","g");}
  else toast("Déjà dans la wishlist");
  render();
}
function tgWL(id){const it=st.wl.find(w=>w.id===id);if(!it)return;it.bought=!it.bought;sv("gq_wl4",st.wl);toast(it.bought?"Acheté ✓":"Démarqué","g");render();}
function oAWiS(){st.wiF={name:"",category:CATS[0],color:GC[0],brand:"",price:"",reason:"",bought:false};oS("wi");}
function oEWiS(id){const it=st.wl.find(w=>w.id===id);if(!it)return;st.wiF={...it};oS("wi");}
function uWiF(k,v){st.wiF[k]=v;rS();}
function uWiFP(v){st.wiF.price=v.replace(/[^0-9]/g,"");rS();}
function saveWi(){
  const f=st.wiF;if(!f.name?.trim()){toast("Le nom est obligatoire","err");return;}
  if(!f.id){st.wl.push({...f,id:Date.now()+""});toast("Ajouté ✓","g");}
  else{const idx=st.wl.findIndex(w=>w.id===f.id);if(idx>=0)st.wl[idx]={...f};toast("Modifié ✓","g");}
  sv("gq_wl4",st.wl);cS();
}
function dWi(id){st.wl=st.wl.filter(w=>w.id!==id);sv("gq_wl4",st.wl);toast("Supprimé");cS();}

// INIT
render();
setTimeout(()=>{
  const txt=AI.rec(st.wr,st.sd,st.rk);st.rt=txt;
  startTW(txt,(d,r)=>{st.twd=d;const el=document.getElementById("tw-text");if(el)el.innerHTML=d+(r?'<span style="opacity:.4;animation:blink .7s step-end infinite;">▍</span>':"");});
},100);
</script>
</body>
</html>
